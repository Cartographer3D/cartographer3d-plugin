name: Update Docs

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-docs:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b # v6.6.0
        with:
          enable-cache: true

      - name: Generate docs
        run: |
          uv run python -m cartographer.config.docs > configuration-reference.md
          uv run python -m cartographer.macros.docs > macro-reference.md

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: Cartographer3D
          repositories: docs

      - name: Checkout docs repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Cartographer3D/docs
          token: ${{ steps.app-token.outputs.token }}
          path: docs-repo

      - name: Update docs
        run: |
          cp configuration-reference.md docs-repo/cartographer-probe/reference/configuration-reference.md
          cp macro-reference.md docs-repo/cartographer-probe/reference/macro-reference.md

      - name: Commit and push
        working-directory: docs-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cartographer-probe/reference/configuration-reference.md
          git add cartographer-probe/reference/macro-reference.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: update reference docs for ${{ github.event.release.tag_name || 'manual' }}"
          git push
